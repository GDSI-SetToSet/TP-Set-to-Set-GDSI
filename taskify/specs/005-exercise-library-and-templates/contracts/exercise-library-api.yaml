openapi: 3.0.3
info:
  title: Set to Set - Exercise Library & Routine Templates API
  version: 1.0.0
  description: Endpoints para gestión de biblioteca de ejercicios, enlaces de video y plantillas genéricas (US-08, US-09, US-12, US-52).

paths:
  /api/v1/exercises:
    get:
      summary: Listar ejercicios (del sistema y propios del entrenador) con filtros
      security:
        - BearerAuth: []
      parameters:
        - name: muscle_group
          in: query
          required: false
          schema:
            type: string
        - name: equipment
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseResponse'

    post:
      summary: Crear un nuevo ejercicio personalizado en la biblioteca
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '400':
          description: Datos obligatorios faltantes o URL de video no soportada

  /api/v1/exercises/{exercise_id}:
    get:
      summary: Obtener detalle de un ejercicio (incluye notas técnicas y video embebible)
      security:
        - BearerAuth: []
      parameters:
        - name: exercise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'

    put:
      summary: Editar ejercicio existente o actualizar enlace de video
      security:
        - BearerAuth: []
      parameters:
        - name: exercise_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseCreateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'

  /api/v1/routine-templates:
    get:
      summary: Listar plantillas de rutinas genéricas del entrenador
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineTemplateResponse'

    post:
      summary: Crear una nueva plantilla genérica de rutina
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineTemplateCreateRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ExerciseCreateRequest:
      type: object
      required: [name, description, target_muscle_group, equipment_needed]
      properties:
        name:
          type: string
          example: "Peso Muerto Rumano con Mancuernas"
        description:
          type: string
          example: "Flexión de cadera manteniendo columna neutra hasta sentir tensión en isquiotibiales."
        target_muscle_group:
          type: string
          example: "Isquiotibiales y Glúteos"
        equipment_needed:
          type: string
          example: "Mancuernas"
        video_url:
          type: string
          format: uri
          example: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        technical_cues:
          type: string
          example: "Inhalar al descender, bloquear abdomen (bracing) y exhalar al extender cadera."

    ExerciseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        target_muscle_group:
          type: string
        equipment_needed:
          type: string
        video_url:
          type: string
        video_platform:
          type: string
          enum: [YOUTUBE, VIMEO, GOOGLE_DRIVE, NONE]
        embed_url:
          type: string
        technical_cues:
          type: string
        is_system:
          type: boolean

    RoutineTemplateCreateRequest:
      type: object
      required: [name, duration_weeks, intensity, exercises]
      properties:
        name:
          type: string
          example: "Iniciación a la Fuerza 3 Días"
        duration_weeks:
          type: integer
          example: 4
        intensity:
          type: string
          enum: [BAJA, MEDIA, ALTA, EXIGENTE]
        has_no_materials_alternative:
          type: boolean
        exercises:
          type: array
          items:
            type: object
            required: [exercise_id, order_index, default_sets, default_reps]
            properties:
              exercise_id:
                type: string
                format: uuid
              order_index:
                type: integer
              default_sets:
                type: integer
              default_reps:
                type: string

    RoutineTemplateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trainer_id:
          type: string
          format: uuid
        name:
          type: string
        duration_weeks:
          type: integer
        intensity:
          type: string
        has_no_materials_alternative:
          type: boolean

openapi: 3.0.3
info:
  title: Set to Set - Exercise Library & Routine Templates API
  version: 1.1.0
  description: >-
    Endpoints para gestión de biblioteca de ejercicios y rutinas genéricas (US-08, US-09).
    Los campos de video se incorporan con US-12 y las notas técnicas con US-52.
    Todos los errores usan RFC 7807 (application/problem+json).

paths:
  /api/v1/exercises:
    get:
      summary: Listar los ejercicios propios del entrenador
      security:
        - BearerAuth: []
      parameters:
        - name: muscle_group
          in: query
          required: false
          description: Filtro exacto por músculo, sin distinguir mayúsculas.
          schema:
            type: string
      responses:
        '200':
          description: Ejercicios del entrenador, sin los dados de baja
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ExerciseResponse'
        '403':
          description: El usuario no es entrenador

    post:
      summary: Crear un ejercicio en la biblioteca
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseInput'
      responses:
        '201':
          description: Ejercicio creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '403':
          description: El usuario no es entrenador
        '422':
          description: Datos obligatorios faltantes o inválidos

  /api/v1/exercises/{exercise_id}:
    parameters:
      - name: exercise_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Obtener el detalle de un ejercicio propio
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detalle del ejercicio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          description: No existe, es de otro entrenador o fue dado de baja

    put:
      summary: Editar un ejercicio propio
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseInput'
      responses:
        '200':
          description: Ejercicio actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExerciseResponse'
        '404':
          description: No existe, es de otro entrenador o fue dado de baja
        '409':
          description: Se quitó la marca a un ejercicio de una rutina apta "Sin materiales"
        '422':
          description: Datos obligatorios faltantes o inválidos

    delete:
      summary: Dar de baja lógica un ejercicio propio
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Ejercicio dado de baja
        '404':
          description: No existe, es de otro entrenador o fue dado de baja

  /api/v1/routine-templates:
    get:
      summary: Listar las rutinas genéricas del entrenador
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Rutinas del entrenador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineTemplateResponse'
        '403':
          description: El usuario no es entrenador

    post:
      summary: Crear una rutina genérica
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineTemplateInput'
      responses:
        '201':
          description: Rutina creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '403':
          description: El usuario no es entrenador
        '422':
          description: Datos faltantes, ejercicios no disponibles o regla "Sin materiales" incumplida

  /api/v1/routine-templates/{template_id}:
    parameters:
      - name: template_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      summary: Obtener una rutina propia
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Detalle de la rutina
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '404':
          description: No existe o es de otro entrenador

    put:
      summary: Editar una rutina propia, reemplazando su estructura
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoutineTemplateInput'
      responses:
        '200':
          description: Rutina actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '404':
          description: No existe o es de otro entrenador
        '422':
          description: Datos faltantes, ejercicios no disponibles o regla "Sin materiales" incumplida

  /api/v1/students/me/routine-templates:
    get:
      summary: Listar en solo lectura las rutinas de los entrenadores con vínculo activo
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Rutinas disponibles para el alumno
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RoutineTemplateResponse'
        '403':
          description: El usuario no es alumno

  /api/v1/students/me/routine-templates/{template_id}:
    get:
      summary: Obtener en solo lectura una rutina de un entrenador con vínculo activo
      security:
        - BearerAuth: []
      parameters:
        - name: template_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de la rutina
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutineTemplateResponse'
        '403':
          description: El usuario no es alumno
        '404':
          description: No existe o el alumno no tiene vínculo activo con el entrenador

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ExerciseCategory:
      type: string
      enum: [FUERZA, CARDIO, MOVILIDAD, FLEXIBILIDAD, EQUILIBRIO]

    ExerciseInput:
      type: object
      required: [name, description, category, target_muscle_group, equipment_needed]
      properties:
        name:
          type: string
          maxLength: 150
          example: "Peso Muerto Rumano con Mancuernas"
        description:
          type: string
          example: "Flexión de cadera manteniendo columna neutra hasta sentir tensión en isquiotibiales."
        category:
          $ref: '#/components/schemas/ExerciseCategory'
        target_muscle_group:
          type: string
          maxLength: 100
          example: "Isquiotibiales"
        equipment_needed:
          type: string
          maxLength: 150
          example: "Mancuernas"
        has_no_materials_alternative:
          type: boolean
          default: false
        video_url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
          description: URL de YouTube, Vimeo o Google Drive; null elimina el video asociado.

    ExerciseResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trainer_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/ExerciseCategory'
        target_muscle_group:
          type: string
        equipment_needed:
          type: string
        has_no_materials_alternative:
          type: boolean
        video_url:
          type: string
          format: uri
          maxLength: 500
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    RoutineTemplateInput:
      type: object
      required: [name, duration_weeks, intensity, days]
      properties:
        name:
          type: string
          maxLength: 150
          example: "Iniciación a la Fuerza 3 Días"
        duration_weeks:
          type: integer
          minimum: 1
          maximum: 52
          example: 4
        intensity:
          type: string
          enum: [BAJA, MEDIA, ALTA, EXIGENTE]
        has_no_materials_alternative:
          type: boolean
          default: false
        days:
          type: array
          minItems: 1
          maxItems: 7
          items:
            type: object
            required: [name, blocks]
            properties:
              name:
                type: string
                maxLength: 100
              blocks:
                type: array
                minItems: 1
                maxItems: 10
                items:
                  type: object
                  required: [name, exercises]
                  properties:
                    name:
                      type: string
                      maxLength: 100
                    exercises:
                      type: array
                      minItems: 1
                      maxItems: 30
                      items:
                        type: object
                        required: [exercise_id, sets, reps, rest_seconds]
                        properties:
                          exercise_id:
                            type: string
                            format: uuid
                          sets:
                            type: integer
                            minimum: 1
                            maximum: 20
                          reps:
                            type: string
                            maxLength: 50
                          rest_seconds:
                            type: integer
                            minimum: 0
                            maximum: 600

    RoutineTemplateResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        trainer_id:
          type: string
          format: uuid
        trainer_name:
          type: string
          nullable: true
        name:
          type: string
        duration_weeks:
          type: integer
        intensity:
          type: string
          enum: [BAJA, MEDIA, ALTA, EXIGENTE]
        has_no_materials_alternative:
          type: boolean
        exercise_count:
          type: integer
        days:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              name:
                type: string
              blocks:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                    name:
                      type: string
                    exercises:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          sets:
                            type: integer
                          reps:
                            type: string
                          rest_seconds:
                            type: integer
                          exercise:
                            $ref: '#/components/schemas/ExerciseResponse'

openapi: 3.0.3
info:
  title: Set to Set - Student Profile & Health API
  version: 1.0.0
  description: Endpoints para datos de perfil del alumno, cuestionario clínico PAR-Q, zonas protegidas y apto médico protegido (US-39 a US-43).

paths:
  /api/v1/students/me/profile:
    get:
      summary: Obtener perfil del alumno autenticado
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
    put:
      summary: Actualizar datos personales y objetivos
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentProfileUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentProfileResponse'
        '422':
          description: Dato obligatorio faltante, teléfono con formato inválido u objetivo fuera del catálogo; el perfil no pasa a PUBLISHED sin al menos un objetivo

  /api/v1/students/{student_id}/goals:
    get:
      summary: Objetivos y motivación del alumno (solo alumno o entrenador con solicitud pendiente/relación activa)
      security:
        - BearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  fitness_goals:
                    type: array
                    items:
                      $ref: '#/components/schemas/FitnessGoal'
                  personal_motivation:
                    type: string
                    nullable: true
        '403':
          description: Entrenador sin solicitud pendiente ni relación activa

  /api/v1/students/me/health-questionnaire:
    get:
      summary: Obtener respuestas del cuestionario de salud
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthQuestionnaireResponse'
        '404':
          description: Cuestionario aún no completado
    post:
      summary: Registrar cuestionario de salud (PAR-Q); cada envío crea una versión nueva vigente y archiva la anterior
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HealthQuestionnaireInput'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthQuestionnaireResponse'
        '422':
          description: Falta alguna de las 5 respuestas Sí/No (no se asume "No")

  /api/v1/students/{student_id}/health-questionnaire:
    get:
      summary: Cuestionario vigente del alumno (solo alumno o entrenador con solicitud pendiente/relación activa)
      security:
        - BearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthQuestionnaireResponse'
        '403':
          description: Entrenador sin solicitud pendiente ni relación activa
        '404':
          description: Alumno inexistente o sin cuestionario

  /api/v1/students/me/protected-zones:
    get:
      summary: Listar zonas corporales a proteger del alumno autenticado (US-42)
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedZonesResponse'
    put:
      summary: Reemplazar/actualizar la lista de zonas a proteger del alumno autenticado (US-42)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtectedZonesUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProtectedZonesResponse'
        '422':
          description: Zona vacía, repetida o con longitud mayor a 80 caracteres

  /api/v1/students/me/medical-clearance:
    get:
      summary: Obtener metadatos del certificado de apto médico vigente del alumno autenticado (US-43)
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalClearanceResponse'
        '404':
          description: Certificado médico no encontrado
    post:
      summary: Adjuntar nuevo certificado de apto médico (PDF o Imagen) (US-43)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, issue_date]
              properties:
                file:
                  type: string
                  format: binary
                issue_date:
                  type: string
                  format: date
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MedicalClearanceResponse'
        '400':
          description: Formato no soportado (solo PDF, JPEG, PNG), archivo vacío o archivo excede 10 MB

  /api/v1/students/{student_id}/medical-clearance/download:
    get:
      summary: Descarga protegida del certificado médico vigente
      security:
        - BearerAuth: []
      parameters:
        - name: student_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Archivo binario con encabezados de content-type
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          description: No autenticado
        '403':
          description: No autorizado (sin vínculo activo de entrenamiento ni solicitud pendiente)
        '404':
          description: Alumno o certificado no encontrado

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    FitnessGoal:
      type: string
      enum: [fuerza, hipertrofia, resistencia, perdida_de_peso, salud_general, movilidad_rehabilitacion]

    StudentProfileUpdateRequest:
      type: object
      # Todos opcionales: se admiten guardados parciales (DRAFT). Para PUBLISHED se exigen first_name, last_name, birth_date, contact_phone y >=1 fitness_goals.
      properties:
        first_name:
          type: string
          maxLength: 100
          nullable: true
        last_name:
          type: string
          maxLength: 100
          nullable: true
        contact_phone:
          type: string
          nullable: true
          pattern: '^\+?[0-9]{10,15}$'
          description: '"+" opcional y 10 a 15 dígitos, sin espacios ni guiones'
        birth_date:
          type: string
          format: date-time
          nullable: true
        profile_picture:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        fitness_goals:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/FitnessGoal'
        personal_motivation:
          type: string
          nullable: true

    StudentProfileResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date-time
          nullable: true
        contact_phone:
          type: string
          nullable: true
        profile_picture:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        fitness_goals:
          type: array
          items:
            $ref: '#/components/schemas/FitnessGoal'
        personal_motivation:
          type: string
          nullable: true
        health_questionnaire_completed:
          type: boolean
        medical_clearance_completed:
          type: boolean
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    HealthQuestionnaireInput:
      type: object
      required: [has_heart_condition, has_chest_pain_activity, has_dizziness_or_balance_loss, has_bone_joint_problem, takes_prescription_meds]
      properties:
        has_heart_condition:
          type: boolean
        has_chest_pain_activity:
          type: boolean
        has_dizziness_or_balance_loss:
          type: boolean
        has_bone_joint_problem:
          type: boolean
        takes_prescription_meds:
          type: boolean
        other_medical_conditions:
          type: string
          nullable: true

    HealthQuestionnaireResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        has_heart_condition:
          type: boolean
        has_chest_pain_activity:
          type: boolean
        has_dizziness_or_balance_loss:
          type: boolean
        has_bone_joint_problem:
          type: boolean
        takes_prescription_meds:
          type: boolean
        other_medical_conditions:
          type: string
          nullable: true
        status:
          type: string
          enum: [CURRENT, ARCHIVED]
        has_risk_answers:
          type: boolean
          description: true si alguna de las 5 preguntas fue respondida Sí; aviso para el entrenador, no bloquea al alumno
        completed_at:
          type: string
          format: date-time

    ProtectedZonesUpdateRequest:
      type: object
      properties:
        zones:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 80

    ProtectedZoneResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        body_area:
          type: string
        created_at:
          type: string
          format: date-time

    ProtectedZonesResponse:
      type: object
      properties:
        zones:
          type: array
          items:
            $ref: '#/components/schemas/ProtectedZoneResponse'

    MedicalClearanceResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        original_filename:
          type: string
        mime_type:
          type: string
        file_size_bytes:
          type: integer
        issue_date:
          type: string
          format: date
        status:
          type: string
          enum: [CURRENT, ARCHIVED]
        created_at:
          type: string
          format: date-time

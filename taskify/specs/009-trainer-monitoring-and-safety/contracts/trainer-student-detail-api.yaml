openapi: 3.0.3
info:
  title: API de resumen del alumno para el entrenador
  version: 1.0.0
  description: Contrato de US-18 (solo lectura) y US-26 (ajuste de la próxima sesión). Las demás historias de monitoreo se documentan en sus propios contratos o se excluyen.
paths:
  /api/v1/trainers/me/students:
    get:
      summary: Listar los alumnos activos del entrenador
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alumnos activos pertenecientes al entrenador autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainerStudentListItem'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/trainers/me/students/{student_id}:
    get:
      summary: Obtener el resumen de un alumno activo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: student_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle autorizado de un alumno activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerStudentDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/trainers/me/sessions/{session_id}/adjustment:
    parameters:
      - in: path
        name: session_id
        required: true
        schema:
          type: string
    get:
      summary: "US-26: reportes de una sesión finalizada y el día de rutina a ajustar"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cargas, RPE, molestias, pedidos de reemplazo, ejercicios del día y ajuste vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionAdjustmentContext'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La sesión sigue en curso (RFC 7807)
    put:
      summary: "US-26: ajustar la próxima sesión de ese día de rutina"
      description: >
        Reescribe el día en la copia de la rutina del alumno (con registro en el historial de cambios). Si el alumno
        tiene una sesión en curso, el ajuste queda PENDING y se aplica cuando esa sesión finaliza o cuando inicia otra.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocks]
              properties:
                note: {type: string, nullable: true, maxLength: 500}
                blocks:
                  type: array
                  minItems: 1
                  items: {type: object, description: Igual a un bloque de RoutineTemplateInput}
      responses:
        '200':
          description: Ajuste guardado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdjustmentView'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Sesión en curso, rutina cambiada, día inexistente o borrador de US-14 sin confirmar (RFC 7807)
        '422':
          description: Ejercicio contraindicado, sin alternativa "Sin materiales", datos inválidos o sin cambios (RFC 7807 con errors)
  /api/v1/students/me/routine-adjustments:
    get:
      summary: "US-26: días con ejercicios \"Ajustado por tu entrenador\" que el alumno todavía no entrenó"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Avisos de ajuste por día
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [day_name, exercise_ids, adjusted_at]
                  properties:
                    day_name: {type: string}
                    note: {type: string, nullable: true}
                    exercise_ids: {type: array, items: {type: string}}
                    adjusted_at: {type: string, format: date-time}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Forbidden:
      description: Error de autorización RFC 7807
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Error de recurso no encontrado RFC 7807
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items: {type: object}
    TrainerStudentListItem:
      type: object
      required: [relationship_id, student_id, full_name, profile_status, has_activity]
      properties:
        relationship_id: {type: string}
        student_id: {type: string}
        full_name: {type: string}
        profile_status: {type: string}
        package_title: {type: string, nullable: true}
        routine_name: {type: string, nullable: true}
        has_activity: {type: boolean}
        unreviewed_alert_count: {type: integer, nullable: true, description: Reservado para US-29}
    TrainerStudentDetail:
      type: object
      required: [relationship, profile, goals, limitations, routine, metrics]
      properties:
        relationship: {type: object}
        profile: {type: object}
        goals: {type: object}
        limitations: {type: object}
        routine: {type: object, nullable: true}
        metrics:
          type: object
          required: [finished_sessions, logged_sets]
          properties:
            finished_sessions: {type: integer}
            last_session_at: {type: string, format: date-time, nullable: true}
            logged_sets: {type: integer}
            last_rpe: {type: number, nullable: true}
            last_tonnage_kg: {type: number, nullable: true}
    AdjustmentView:
      type: object
      required: [id, status, changed_exercise_ids, created_at]
      properties:
        id: {type: string}
        status: {type: string, enum: [PENDING, APPLIED]}
        note: {type: string, nullable: true}
        changed_exercise_ids: {type: array, items: {type: string}}
        created_at: {type: string, format: date-time}
        applied_at: {type: string, format: date-time, nullable: true}
    SessionAdjustmentContext:
      type: object
      required: [session_id, day_name, logged_exercises, pain_zones, replacement_requests, blocks, can_adjust]
      properties:
        session_id: {type: string}
        day_name: {type: string}
        started_at: {type: string, format: date-time}
        finished_at: {type: string, format: date-time, nullable: true}
        rpe: {type: integer, nullable: true}
        logged_exercises: {type: array, items: {type: object}}
        pain_zones:
          type: array
          items:
            type: object
            properties:
              zone: {type: string}
              zone_label: {type: string}
              intensity: {type: string, enum: [DISCOMFORT, PAIN]}
              exercise_name: {type: string, nullable: true}
              context: {type: string}
        replacement_requests:
          type: array
          items:
            type: object
            properties:
              original_exercise_id: {type: string}
              original_exercise_name: {type: string}
              replacement_exercise_name: {type: string, nullable: true, description: None si el alumno salteó el ejercicio}
        blocks: {type: array, items: {type: object}, description: Día vigente, o el ajuste pendiente si lo hay}
        can_adjust: {type: boolean}
        blocked_reason: {type: string, nullable: true}
        current_adjustment: {$ref: '#/components/schemas/AdjustmentView', nullable: true}

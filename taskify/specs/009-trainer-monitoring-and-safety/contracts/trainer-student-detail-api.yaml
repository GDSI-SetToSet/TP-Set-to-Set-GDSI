openapi: 3.0.3
info:
  title: API de resumen del alumno para el entrenador
  version: 1.0.0
  description: Contrato de solo lectura de US-18 y US-24 (comparación de sesiones). Las demás historias de monitoreo se documentan en sus propios contratos o se excluyen.
paths:
  /api/v1/trainers/me/students:
    get:
      summary: Listar los alumnos activos del entrenador
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Alumnos activos pertenecientes al entrenador autenticado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrainerStudentListItem'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/trainers/me/students/{student_id}:
    get:
      summary: Obtener el resumen de un alumno activo
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: student_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Detalle autorizado de un alumno activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainerStudentDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/trainers/me/sessions/{session_id}/comparison:
    get:
      summary: "US-24: comparar una sesión finalizada con lo planificado y con la sesión previa del mismo día de rutina"
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: session_id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comparación de métricas por ejercicio y por sesión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionComparison'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: La sesión todavía está en curso (RFC 7807)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  responses:
    Forbidden:
      description: Error de autorización RFC 7807
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Error de recurso no encontrado RFC 7807
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        instance: {type: string}
        errors:
          type: array
          items: {type: object}
    TrainerStudentListItem:
      type: object
      required: [relationship_id, student_id, full_name, profile_status, has_activity]
      properties:
        relationship_id: {type: string}
        student_id: {type: string}
        full_name: {type: string}
        profile_status: {type: string}
        package_title: {type: string, nullable: true}
        routine_name: {type: string, nullable: true}
        has_activity: {type: boolean}
        unreviewed_alert_count: {type: integer, nullable: true, description: Reservado para US-29}
    TrainerStudentDetail:
      type: object
      required: [relationship, profile, goals, limitations, routine, metrics]
      properties:
        relationship: {type: object}
        profile: {type: object}
        goals: {type: object}
        limitations: {type: object}
        routine: {type: object, nullable: true}
        metrics:
          type: object
          required: [finished_sessions, logged_sets]
          properties:
            finished_sessions: {type: integer}
            last_session_at: {type: string, format: date-time, nullable: true}
            logged_sets: {type: integer}
            last_rpe: {type: number, nullable: true}
            last_tonnage_kg: {type: number, nullable: true}
    PerformedMetrics:
      type: object
      required: [sets_completed, reps, volume_kg, total_duration_seconds]
      properties:
        sets_completed: {type: integer}
        reps: {type: array, items: {type: string}}
        max_weight_kg: {type: number, nullable: true}
        volume_kg: {type: number, description: Suma de repeticiones × carga de las series con valores numéricos}
        total_duration_seconds: {type: integer}
    ExerciseComparison:
      type: object
      required: [exercise_id, exercise_name]
      properties:
        exercise_id: {type: string}
        exercise_name: {type: string}
        replaced_exercise_name: {type: string, nullable: true, description: Ejercicio planificado que el alumno reemplazó (US-54)}
        planned:
          type: object
          nullable: true
          properties:
            sets: {type: integer}
            reps: {type: string}
            target_weight_kg: {type: number, nullable: true}
        performed: {$ref: '#/components/schemas/PerformedMetrics', nullable: true}
        previous: {$ref: '#/components/schemas/PerformedMetrics', nullable: true}
    SessionComparison:
      type: object
      required: [session, exercises, volume_kg]
      properties:
        session: {type: object, description: Igual a DailyRoutineSession}
        previous_session: {type: object, nullable: true, description: Última sesión finalizada anterior del mismo día de rutina}
        volume_kg: {type: number}
        previous_volume_kg: {type: number, nullable: true}
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseComparison'

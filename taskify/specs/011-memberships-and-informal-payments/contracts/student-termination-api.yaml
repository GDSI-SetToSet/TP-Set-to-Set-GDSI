openapi: 3.0.3
info:
  title: API de baja de alumno (US-35)
  version: 1.0.0
  description: El entrenador finaliza el vínculo activo con un alumno indicando el motivo. No se puede deshacer.
paths:
  /api/v1/trainers/me/students/{student_id}/termination:
    post:
      summary: Dar de baja al alumno (escenarios 1–3)
      security: [{ bearerAuth: [] }]
      parameters:
        - { in: path, name: student_id, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [category]
              properties:
                category: { type: string, enum: [FALTA_DE_PAGO, RAZONES_PERSONALES, OTRO] }
                detail: { type: string, maxLength: 500, nullable: true, description: 'Obligatorio con OTRO' }
      responses:
        '200':
          description: Vínculo TERMINATED; el alumno recibe la notificación SUBSCRIPTION_TERMINATED con el motivo.
          content:
            application/json:
              schema:
                type: object
                properties:
                  relationship_id: { type: string }
                  student_id: { type: string }
                  status: { type: string, enum: [TERMINATED] }
                  end_date: { type: string, format: date }
                  terminated_at: { type: string, format: date-time }
                  category: { type: string, enum: [FALTA_DE_PAGO, RAZONES_PERSONALES, OTRO] }
                  detail: { type: string, nullable: true }
                  available_slots: { type: integer }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { description: 'Sin vínculo activo con ese alumno (incluye una baja repetida)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
        '422': { description: 'Falta la categoría, es inválida o falta el detalle con OTRO (errors[] por campo)', content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Problem:
      description: Error RFC 7807
      content: { application/problem+json: { schema: { $ref: '#/components/schemas/Problem' } } }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors: { type: array, items: { type: object, properties: { field: { type: string }, message: { type: string } } } }

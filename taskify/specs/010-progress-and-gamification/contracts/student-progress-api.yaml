openapi: 3.0.3
info:
  title: API de evolución del alumno
  version: 1.0.0
  description: Contrato de US-65 (solo lectura). Solo devuelve datos del alumno autenticado.
paths:
  /api/v1/students/me/progress:
    get:
      summary: Evolución de cargas, volumen semanal y PRs del alumno autenticado
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: exercise_id, schema: { type: string }, description: Filtra por ejercicio }
        - { in: query, name: muscle_group, schema: { type: string }, description: Filtra por grupo muscular }
        - { in: query, name: from, schema: { type: string, format: date }, description: Inicio del rango (UTC) }
        - { in: query, name: to, schema: { type: string, format: date }, description: Fin del rango (UTC) }
      responses:
        '200':
          description: Sin from/to se devuelven las últimas 12 semanas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProgress' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Problem:
      description: Error RFC 7807 (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    StudentProgress:
      type: object
      required: [range, muscle_groups, has_data, exercises, weekly_volume, week_comparison, personal_records]
      properties:
        range:
          type: object
          required: [from, to, is_default]
          properties:
            from: { type: string, format: date }
            to: { type: string, format: date }
            is_default: { type: boolean }
        muscle_groups: { type: array, items: { type: string } }
        has_data: { type: boolean }
        exercises: { type: array, items: { $ref: '#/components/schemas/ExerciseLoad' } }
        weekly_volume: { type: array, items: { $ref: '#/components/schemas/WeeklyVolume' } }
        week_comparison: { $ref: '#/components/schemas/WeekComparison' }
        personal_records:
          type: array
          description: Orden cronológico ascendente.
          items: { $ref: '#/components/schemas/PersonalRecordEntry' }
    ExerciseLoad:
      type: object
      required: [exercise_id, name, muscle_group, has_trend, points]
      properties:
        exercise_id: { type: string }
        name: { type: string }
        muscle_group: { type: string }
        has_trend: { type: boolean, description: false si hay menos de 2 puntos }
        points:
          type: array
          items:
            type: object
            required: [date, weight_kg, reps, is_pr]
            properties:
              date: { type: string, format: date }
              weight_kg: { type: number }
              reps: { type: string, description: Repeticiones tal como se registraron }
              is_pr: { type: boolean }
    WeeklyVolume:
      type: object
      required: [week_start, week_end, volume_kg, is_partial]
      properties:
        week_start: { type: string, format: date }
        week_end: { type: string, format: date }
        volume_kg: { type: number, description: 0 en semanas sin series }
        is_partial: { type: boolean }
    WeekComparison:
      type: object
      required: [current_volume_kg, previous_volume_kg, previous_avg_kg]
      properties:
        current_volume_kg: { type: number }
        previous_volume_kg: { type: number }
        delta_vs_previous_pct: { type: number, nullable: true }
        previous_avg_kg: { type: number }
    PersonalRecordEntry:
      type: object
      required: [exercise_id, exercise_name, weight_kg, reps, achieved_at, is_initial]
      properties:
        exercise_id: { type: string }
        exercise_name: { type: string }
        weight_kg: { type: number }
        reps: { type: string, description: Repeticiones tal como se registraron }
        achieved_at: { type: string, format: date-time }
        previous_weight_kg: { type: number, nullable: true }
        is_initial: { type: boolean }

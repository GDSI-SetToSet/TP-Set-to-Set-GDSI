openapi: 3.0.3
info:
  title: API de evolución del alumno
  version: 1.0.0
  description: Contrato de US-65 (solo lectura). Solo devuelve datos del alumno autenticado.
paths:
  /api/v1/students/me/progress:
    get:
      summary: Evolución del alumno autenticado (progreso por ejercicio, constancia, récords y próxima sesión)
      security:
        - bearerAuth: []
      parameters:
        - { in: query, name: period, schema: { type: string, enum: ['4w', '12w', all], default: '12w' }, description: Período de las secciones de progreso, constancia y récords }
        - { in: query, name: muscle_group, schema: { type: string }, description: Filtra ejercicios, récords y ejercicios nuevos (no el resumen) }
      responses:
        '200':
          description: Evolución del período.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StudentProgress' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  responses:
    Problem:
      description: Error RFC 7807 (application/problem+json)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, detail, instance]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        errors:
          type: array
          items: { type: object, properties: { field: { type: string }, message: { type: string } } }
    SetResult:
      type: object
      properties:
        weight: { type: number, nullable: true, description: Null sin carga (peso corporal) }
        reps: { type: integer, nullable: true }
    StudentProgress:
      type: object
      required: [period, muscle_groups, has_sessions, summary, exercises, consistency, records, new_exercises]
      properties:
        period:
          type: object
          required: [key, end]
          properties:
            key: { type: string, enum: ['4w', '12w', all] }
            start: { type: string, format: date, nullable: true }
            end: { type: string, format: date }
        muscle_group: { type: string, nullable: true }
        muscle_groups: { type: array, items: { type: string }, description: Opciones del filtro, sin filtrar }
        has_sessions: { type: boolean }
        summary:
          type: object
          properties:
            improving_exercises_last_4w: { type: integer }
            streak:
              type: object
              properties: { current_weeks: { type: integer }, best_weeks: { type: integer } }
            records_in_period: { type: integer }
        exercises:
          type: array
          items:
            type: object
            properties:
              exercise_id: { type: string }
              name: { type: string }
              muscle_group: { type: string }
              metric: { type: string, enum: [max_weight, max_reps] }
              start: { $ref: '#/components/schemas/SetResult' }
              current: { $ref: '#/components/schemas/SetResult' }
              best: { $ref: '#/components/schemas/SetResult' }
              message_key: { type: string, enum: [weight_increased, reps_increased, no_change, below_best, bodyweight_reps_increased, few_data] }
              weeks_without_change: { type: integer }
              last_improvement_is_pr: { type: boolean }
              points:
                type: array
                items:
                  type: object
                  properties:
                    date: { type: string, format: date }
                    weight: { type: number, nullable: true }
                    reps: { type: integer }
                    target_weight: { type: number, nullable: true }
                    is_pr: { type: boolean }
        consistency:
          type: array
          description: La semana en curso lleva is_partial y no entra en ningún cálculo.
          items:
            type: object
            properties:
              period_start: { type: string, format: date }
              period_end: { type: string, format: date }
              scheduled: { type: integer }
              completed: { type: integer }
              is_partial: { type: boolean }
        records:
          type: array
          description: Del más reciente al más viejo; la primera carga de un ejercicio no es récord.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              exercise_id: { type: string }
              name: { type: string }
              weight: { type: number, nullable: true }
              reps: { type: integer }
              previous: { $ref: '#/components/schemas/SetResult' }
        new_exercises:
          type: array
          items:
            type: object
            properties: { exercise_id: { type: string }, name: { type: string }, first_date: { type: string, format: date } }
        next_session:
          type: object
          nullable: true
          properties:
            day_name: { type: string }
            trainer_feedback: { type: string, nullable: true }
            exercises:
              type: array
              items:
                type: object
                properties:
                  exercise_id: { type: string }
                  name: { type: string }
                  last: { allOf: [{ $ref: '#/components/schemas/SetResult' }], nullable: true }
                  target_weight: { type: number, nullable: true }
                  reps: { type: string }
                  sets: { type: integer }
                  adjusted_by_trainer: { type: boolean }
                  trainer_note: { type: string, nullable: true }

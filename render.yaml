services:
  - type: web
    name: set-to-set-gdsi-api
    runtime: python
    branch: main
    plan: free
    region: virginia
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://set-to-set-gdsi-web.onrender.com/restablecer-contrasena
      - key: EMAIL_BACKEND
        value: console

  - type: web
    name: set-to-set-gdsi-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

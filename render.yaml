databases:
  - name: set-to-set-gdsi-db
    databaseName: set_to_set
    user: set_to_set
    plan: 0.1c-256mb
    region: virginia
    diskSizeGB: 1

services:
  - type: web
    name: set-to-set-gdsi-api
    runtime: python
    branch: main
    plan: 0.5c-512mb
    region: virginia
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.src.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: medical-clearances
      mountPath: /opt/render/project/src/backend/uploads
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: set-to-set-gdsi-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: PASSWORD_RESET_URL
        value: https://set-to-set-gdsi-web.onrender.com/restablecer-contrasena
      - key: EMAIL_BACKEND
        value: smtp
      - key: EMAIL_FROM
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_USE_TLS
        value: "true"

  - type: web
    name: set-to-set-gdsi-web
    runtime: static
    branch: main
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
